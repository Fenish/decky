; streamdeck - firmware for the CrowPanel Basic 7.0" ESP32 HMI (ESP32-S3-WROOM-1-N4R8)
;
; Toolchain, board definition, partition table and the LovyanGFX patch are taken
; verbatim from Elecrow's own V3.0 PlatformIO example. Do not "modernise" the
; pinned versions: LovyanGFX 1.2.25 only drives this RGB panel correctly on
; arduino-esp32 3.3.8 *with* the Bus_RGB patch in patches/.

[platformio]
boards_dir = .

[env:esp32-s3-devkitc-1-myboard]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1-myboard
framework = arduino

; Port is auto-detected. Override here (or with --upload-port) if several serial
; devices are attached.
;
; 921600 (the board definition's default) corrupts transfers on this board's
; CH340 - a full flash read failed there and succeeded at 460800. Do not raise
; it without re-testing a full read.
upload_speed = 460800
monitor_speed = 115200

extra_scripts =
	pre:scripts/patch_lovyangfx.py
	pre:scripts/firmware_version.py
	post:scripts/bundle_for_desktop.py

lib_deps =
	lovyan03/LovyanGFX@1.2.25

board_build.partitions = partitions_deck.csv
board_build.filesystem = littlefs

platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
	framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz
